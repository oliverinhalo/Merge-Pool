name: Release

# Publishes the release that every installed copy of MergePool updates itself from, either from a
# pushed tag or by hand against a branch. The zip is what the in-app updater downloads; the setup
# executable is for a first install.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.3.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ github.event.inputs.version }}'
          } else {
            '${{ github.ref_name }}'.TrimStart('v')
          }

          $props = Get-Content Directory.Build.props -Raw
          if ($props -notmatch '<VersionPrefix>([^<]+)</VersionPrefix>') {
            throw 'Could not read VersionPrefix from Directory.Build.props.'
          }

          # A tag that does not match the version in the tree would ship a build that reports the
          # wrong version, and every installed copy decides whether to update by comparing versions.
          if ($Matches[1] -ne $version) {
            throw "Tag says $version but Directory.Build.props says $($Matches[1])."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install WinFsp
        run: choco install winfsp --yes --no-progress

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Test
        run: dotnet test MergePool.sln -c Release --verbosity normal

      - name: Build the update package
        shell: pwsh
        run: .\installer\package.ps1 -Configuration Release -Version ${{ steps.version.outputs.version }}

      - name: Build the installer
        shell: pwsh
        run: .\installer\build.ps1 -Configuration Release -Version ${{ steps.version.outputs.version }}

      - name: Point the tag at the commit being released
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The release action reuses a tag wherever it already points. On a tag push that is the
          # right commit by definition, but on a manual run the tag may not exist yet, or may be
          # left over on a branch commit — and then the release would describe a commit that is not
          # the one just built. Set it here, where the tests and both builds have already passed, so
          # nothing is ever tagged that did not build.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force "v$env:VERSION" $env:GITHUB_SHA
          git push --force origin "refs/tags/v$env:VERSION"
          Write-Host "v$env:VERSION now points at $env:GITHUB_SHA."

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MergePool ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/package/MergePool-${{ steps.version.outputs.version }}-windows-x64.zip
            artifacts/package/SHA256SUMS.txt
            installer/Output/MergePool-${{ steps.version.outputs.version }}-setup.exe
